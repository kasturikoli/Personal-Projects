<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Moo 💖</title>

  <!-- Delius Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Delius", cursive;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #fff5ec 0%, #ffe3f2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Floating Emoji Layer */
    #float-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .float-emoji {
      position: absolute;
      font-size: 22px;
      opacity: 0.85;
      animation: floatUp 6s linear forwards;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Card */
    .card {
      width: 640px;
      height: 400px;
      padding: 36px;
      background: linear-gradient(180deg, #f6eef4 0%, #e3c8df 100%);
      border-radius: 24px;
      box-shadow:
        0 25px 60px rgba(170, 90, 160, 0.28),
        0 0 0 1px rgba(255, 255, 255, 0.5);
      text-align: center;
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 40px;
    }

    .card.mcq {
    justify-content: flex-start;
}

    h2 {
      margin: 0;
      color: #4a2c3a;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: #5a4a4a;
      font-size: 18px;
    }

    /* Slider */
    input[type="range"] {
      width: 100%;
      margin-top: -4px; /* spacing control */
    }

.slider-value {
  font-size: 18px;
  color: #ff4d6d;
  margin-top: -30px;
}

    .block {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 15px;
      margin-top: -4px; /* spacing control */
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .why {
  margin-bottom: 8px;
}

    /* Emoji Bar */
 #emoji-bar {
  position: fixed;
  bottom: 20px;

  left: 50%;
  transform: translateX(-50%);

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;

  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(8px);

  padding: 8px 16px;
  border-radius: 24px;

  z-index: 3;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.emoji-btn {
  width: 36px;
  height: 36px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 22px;
  background: none;
  border: none;
  cursor: pointer;
}

    .emoji-btn:hover {
      transform: scale(1.3);
    }

    button {
      padding: 12px 20px;
      border-radius: 14px;
      border: none;
      background: #b455a0;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

.mcq-options {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.mcq-btn {
  padding: 16px 20px;
  border-radius: 20px;
  border: none;

  background: rgba(255,255,255,0.95);
  color: #4a2c3a;

  font-size: 18px;
  cursor: pointer;

  max-width: 480px;
  width: 100%;
  margin: 0 auto;

  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.mcq-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 26px rgba(0,0,0,0.12);
}

  </style>
</head>

<body>

  <div id="float-layer"></div>
  <div id="app"></div>

  <div id="emoji-bar">
    <button class="emoji-btn">💋</button>
    <button class="emoji-btn">🫧</button>
    <button class="emoji-btn">🎈</button>
    <button class="emoji-btn">🎵</button>
  </div>

  <script>
    const app = document.getElementById("app");
    const floatLayer = document.getElementById("float-layer");

    let currentEmoji = "💋";
    let emojiInterval = null;

    function createFloatEmoji() {
      const el = document.createElement("div");
      el.className = "float-emoji";
      el.textContent = currentEmoji;
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = Math.random() * 12 + 18 + "px";
      floatLayer.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }

    function startEmojiRain(emoji) {
      currentEmoji = emoji;
      if (emojiInterval) clearInterval(emojiInterval);
      emojiInterval = setInterval(createFloatEmoji, 500);
    }

    document.querySelectorAll(".emoji-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        startEmojiRain(btn.textContent);
      });
    });

    function firstScreen() {
      app.innerHTML = `
        <div class="card">
          <h2>Hello Momo 🐮💞</h2>
<div class="block">
  <p class="question">How was your day?</p>

  <input
    type="range"
    min="0"
    max="10"
    step="0.1"
    value="7.2"
    id="daySlider"
  />
</div>

          <div class="slider-value" id="sliderValue">7.2</div>
<div class="block" id="whyContainer" style="display:none;">
  <p class="why">Kashala?</p>
  <input type="text" id="whyInput" placeholder="Tell me..." />
</div>

        </div>
      `;

      const slider = document.getElementById("daySlider");
      const valueText = document.getElementById("sliderValue");
      const whyBox = document.getElementById("whyContainer");
      const whyInput = document.getElementById("whyInput");

      slider.addEventListener("change", () => {
        valueText.textContent = slider.value;
        whyBox.style.display = "block";
      });

      whyInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.value.trim() !== "") {
          secondScreen();
        }
      });
    }
const mcqQuestions = [
  {
    question: "What do you love most about us? 💕",
    options: ["Talking", "Laughing", "Fighting", "Everything"]
  },
  {
    question: "What’s your comfort food? 🍕",
    options: ["Pizza", "Burger", "Home food", "You"]
  },
  {
    question: "Where should we go next? ✈️",
    options: ["Mountains", "Beach", "Stay home", "Anywhere together"]
  }
];

let currentQuestionIndex = 0;
      function showMCQ() {
  const q = mcqQuestions[currentQuestionIndex];

app.innerHTML = `
  <div class="card mcq">
    <h2>${q.question}</h2>
    <div class="mcq-options">
      ${q.options.map(opt =>
        `<button class="mcq-btn">${opt}</button>`
      ).join("")}
    </div>
  </div>
`;

  document.querySelectorAll(".mcq-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentQuestionIndex++;
      if (currentQuestionIndex < mcqQuestions.length) {
        showMCQ();
      } else {
        finalScreen();
      }
    });
  });
}

    function secondScreen() {
  app.innerHTML = `
    <div class="card">
      <h2>Me has a few questions to ask you… 💭</h2>
      <button id="okBtn">Okieee</button>
    </div>
  `;

  document.getElementById("okBtn").addEventListener("click", () => {
    currentQuestionIndex = 0;
    showMCQ();
  });
}

    function finalScreen() {
  app.innerHTML = `
    <div class="card">
      <h2>Okayyy… one last thing 💖</h2>
      <p>You ready for the real question?</p>
    </div>
  `;
}

    firstScreen();
    startEmojiRain("💋");
  </script>

</body>
</html>
