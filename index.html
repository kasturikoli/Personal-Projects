<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Moo 💖</title>

  <!-- Delius Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Delius", cursive;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #fff5ec 0%, #ffe3f2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Floating Emoji Layer */
    #float-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .float-emoji {
      position: absolute;
      font-size: 22px;
      opacity: 0.85;
      animation: floatUp 6s linear forwards;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Card */
    .card {
      width: 640px;
      height: 400px;
      padding: 36px;
      background: linear-gradient(180deg, #f6eef4 0%, #e3c8df 100%);
      border-radius: 24px;
      box-shadow:
        0 25px 60px rgba(170, 90, 160, 0.28),
        0 0 0 1px rgba(255, 255, 255, 0.5);
      text-align: center;
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 40px;
    }

    .card.mcq {
      justify-content: flex-start;
    }

    h2 {
      margin: 0;
      color: #4a2c3a;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: #5a4a4a;
      font-size: 18px;
    }

    /* Slider */
    input[type="range"] {
      width: 100%;
    }

    .slider-value {
      font-size: 18px;
      color: #ff4d6d;
      margin-top: -30px;
    }

    .block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    /* Emoji Bar */
    #emoji-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 24px;
      z-index: 3;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .emoji-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: none;
      border: none;
      cursor: pointer;
    }

    button {
      padding: 14px 22px;
      border-radius: 16px;
      border: none;
      background: #b455a0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .mcq-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mcq-btn {
      padding: 16px 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.95);
      color: #4a2c3a;
      font-size: 18px;
      cursor: pointer;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    /* Valentine Screen */
    .valentine-text {
      font-size: 30px;
      color: #4a2c3a;
      min-height: 40px;
    }

    .cta-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .gif {
      width: 200px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div id="float-layer"></div>
<div id="app"></div>

<div id="emoji-bar">
  <button class="emoji-btn">💋</button>
  <button class="emoji-btn">🫧</button>
  <button class="emoji-btn">🎈</button>
  <button class="emoji-btn">🎵</button>
</div>

<script>
  const app = document.getElementById("app");
  const floatLayer = document.getElementById("float-layer");

  let currentEmoji = "💋";
  let emojiInterval = null;

  function createFloatEmoji() {
    const el = document.createElement("div");
    el.className = "float-emoji";
    el.textContent = currentEmoji;
    el.style.left = Math.random() * 100 + "vw";
    floatLayer.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }

  function startEmojiRain(emoji) {
    currentEmoji = emoji;
    clearInterval(emojiInterval);
    emojiInterval = setInterval(createFloatEmoji, 500);
  }

  document.querySelectorAll(".emoji-btn").forEach(btn => {
    btn.onclick = () => startEmojiRain(btn.textContent);
  });

  function firstScreen() {
    app.innerHTML = `
      <div class="card">
        <h2>Hello Momo 🐮💞</h2>
        <p>How was your day?</p>
        <input type="range" min="0" max="10" step="0.1" value="7.2" id="daySlider"/>
        <div class="slider-value" id="sliderValue">7.2</div>
        <input type="text" id="whyInput" placeholder="Kashala?" style="display:none"/>
      </div>
    `;

    const slider = document.getElementById("daySlider");
    const valueText = document.getElementById("sliderValue");
    const whyInput = document.getElementById("whyInput");

    slider.onchange = () => {
      valueText.textContent = slider.value;
      whyInput.style.display = "block";
    };

    whyInput.onkeydown = e => {
      if (e.key === "Enter") secondScreen();
    };
  }

  const mcqQuestions = [
  {
    question: "Chalo bataoo what I like the most about you? 💕",
    options: [
      "You being you 🥹🫶🏻",
      "Pookie🎀 and Edibleness🔥 in one package",
      "Abhi ho itne ache kya kare🫶🏻",
      "All of the above🖤"
    ]
  },
  {
    question: "Abhi you know me misses you...kitna you miss me?",
    options: [
      "Ab toh aadat si hai mujhko aise",
      "Ha karta hu miss thoda",
      "I miss you",
      "Sab options galat..."
    ]
  },
  {
    question: "Toh hum kab milengeeeeeeeee? 😭😭",
    options: [
      "Karte hai plan...",
      "Ruko zara, Sabr rakho",
      "Ata chya ata",
      "Idhar bhi drama chalu"
    ]
  },
  {
    question: "Agar hamari story had a genre.. which one would it be?",
    options: [
      "Rom-Com",
      "Drama",
      "Indian TV wala genre",
      "Mystery",
      "Sochna padega"
    ]
  },
  {
    question: "Last questionn... puchuuu?",
    options: [
      "Of course",
      "Jaa ree",
      "I know what is coming next",
      "Bol jaldii"
    ]
  },
  {
    question: "Pakka this is last... puchu kyaa??",
    options: [
      "One eternity later",
      "Kiti drama",
      "Bol re",
      "Okiee"
    ]
  },
  {
    question: "Are you readyy?",
    options: [
      "*duck running gif*",
      "Ha ree",
      "I am born ready",
      "No, I am Mohit"
    ]
  }
];

  let currentQuestionIndex = 0;

  function showMCQ() {
    const q = mcqQuestions[currentQuestionIndex];
    app.innerHTML = `
      <div class="card mcq">
        <h2>${q.question}</h2>
        <div class="mcq-options">
          ${q.options.map(o => `<button class="mcq-btn">${o}</button>`).join("")}
        </div>
      </div>
    `;

    document.querySelectorAll(".mcq-btn").forEach(btn => {
      btn.onclick = () => {
        currentQuestionIndex++;
        currentQuestionIndex < mcqQuestions.length ? showMCQ() : finalScreen();
      };
    });
  }

  function secondScreen() {
    app.innerHTML = `
      <div class="card">
        <h2>Me has v v v imp questions… 💭</h2>
        <button id="okBtn">Okieee</button>
      </div>
    `;
    document.getElementById("okBtn").onclick = () => {
      currentQuestionIndex = 0;
      showMCQ();
    };
  }

  function finalScreen() {
    app.innerHTML = `
      <div class="card">
        <div class="valentine-text" id="typingText"></div>
        <div class="cta-row" id="ctaRow" style="display:none;">
          <button id="yesBtn">Yes 💖</button>
          <button id="noBtn">No 😤</button>
          <button id="maybeBtn">Maybe 🤔</button>
        </div>
      </div>
    `;

    typeText("Will you be my Valentine? 💌", () => {
      document.getElementById("ctaRow").style.display = "flex";
      setupCTAs();
    });
  }

  function typeText(text, done) {
    const el = document.getElementById("typingText");
    let i = 0;
    const t = setInterval(() => {
      el.textContent += text[i++];
      if (i === text.length) {
        clearInterval(t);
        done();
      }
    }, 80);
  }

  function setupCTAs() {
    document.getElementById("yesBtn").onclick = () => {
      app.innerHTML = `
        <div class="card">
          <h2>YAAAYYYY!! 😭💖</h2>
          <img class="gif" src="https://media.tenor.com/qhE5zL1LqUAAAAAC/cat-kiss.gif"/>
        </div>
      `;
    };

    document.getElementById("noBtn").onmouseover = e => {
      e.target.style.transform = `translate(${Math.random()*200-100}px,${Math.random()*100-50}px)`;
    };

    document.getElementById("maybeBtn").onclick = () => {
      app.innerHTML = `
        <div class="card">
          <img class="gif" src="https://media.tenor.com/2C9D9lKZ3vMAAAAC/nikal-laude.gif"/>
        </div>
      `;
    };
  }

  firstScreen();
  startEmojiRain("💋");
</script>

</body>
</html>
