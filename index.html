<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For You 💖</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background-color: #fbf1e5;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 💖 Floating Hearts Background */
    #hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      color: #ff6b81;
      font-size: 20px;
      opacity: 0.8;
      animation: floatUp 6s linear forwards;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    /* 💗 Card */
    .card {
      background: #ccb7ae;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 640px;
      height: 640px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 0.6s ease;
      position: relative;
      z-index: 2;
    }

    input {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      position: relative;
    }

    button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #ffffff;
      position: absolute;
      right: 0;
    }

    img {
      margin-top: 20px;
      width: 200px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>

  <!-- Background Hearts -->
  <div id="hearts"></div>

  <!-- App Container -->
  <div id="app"></div>

  <script>
    const app = document.getElementById("app");
    let userName = "";

    /* Screen 1 */
    function firstScreen() {
      app.innerHTML = `
        <div class="card">
          <h2>Hello Momo🐮💕</h2>
          <p> How is your day?</p>
          <input id="input" placeholder="Enter rating..." />
        </div>
      `;

      document.getElementById("input").addEventListener("keydown", e => {
        if (e.key === "Enter" && e.target.value.trim() !== "") {
          userName = e.target.value.trim();
          questionIntro();
        }
      });
    }

    /* Screen 2 */
    function questionIntro() {
      app.innerHTML = `
        <div class="card">
          <h2>${userName},</h2>
          <p>I have a question...</p>
        </div>
      `;

      setTimeout(valentineQuestion, 2000);
    }

    /* Screen 3 */
    function valentineQuestion() {
      app.innerHTML = `
        <div class="card">
          <h2>Will you be my valentine?👉🏻👈🏻🥹</h2>
          <div class="buttons">
            <button id="yes">Yes</button>
            <button id="no">No</button>
          </div>
        </div>
      `;

      const noBtn = document.getElementById("no");
      noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * 200 - 100;
        const y = Math.random() * 200 - 100;
        noBtn.style.transform = `translate(${x}px, ${y}px)`;
      });

      document.getElementById("yes").onclick = finalScreen;
    }

    /* Final Screen */
    function finalScreen() {
      app.innerHTML = `
        <div class="card">
          <h1>YAAYYYY 🎉💖</h1>
          <img src="https://media.giphy.com/media/3oz8xAFtqoOUUrsh7W/giphy.gif" alt="Celebration" />
        </div>
      `;
    }

    /* 💕 Heart Generator */
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 10 + 15 + "px";
      document.getElementById("hearts").appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 500);

    /* Start */
    firstScreen();
  </script>

</body>
</html>
