<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Moo 💖</title>

  <!-- Delius Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Delius", cursive;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #fff5ec 0%, #ffe3f2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Floating Emoji Layer */
    #float-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .float-emoji {
      position: absolute;
      font-size: 22px;
      opacity: 0.85;
      animation: floatUp 6s linear forwards;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Card */
    .card {
      width: 640px;
      height: 400px;
      padding: 36px;
      background: linear-gradient(180deg, #f6eef4 0%, #e3c8df 100%);
      border-radius: 24px;
      box-shadow:
        0 25px 60px rgba(170, 90, 160, 0.28),
        0 0 0 1px rgba(255, 255, 255, 0.5);
      text-align: center;
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 40px;
    }

    h2 {
      margin: 0;
      color: #4a2c3a;
      font-size: 22px;
    }

    p {
      margin: 0;
      color: #5a4a4a;
      font-size: 15px;
    }

    /* Slider */
    input[type="range"] {
      width: 100%;
      margin-top: -4px; /* spacing control */
    }

.slider-value {
  font-size: 18px;
  color: #ff4d6d;
  margin-top: -30px;
}

    .block {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 15px;
      margin-top: -4px; /* spacing control */
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    /* Emoji Bar */
    #emoji-bar {
      position: fixed;
      bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 16px;
      background: rgba(255,255,255,0.65);
      padding: 6px 12px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      z-index: 3;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .emoji-btn {
      font-size: 26px;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .emoji-btn:hover {
      transform: scale(1.3);
    }

    button {
      padding: 12px 20px;
      border-radius: 14px;
      border: none;
      background: #b455a0;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div id="float-layer"></div>
  <div id="app"></div>

  <div id="emoji-bar">
    <button class="emoji-btn">💋</button>
    <button class="emoji-btn">🫧</button>
    <button class="emoji-btn">🎈</button>
    <button class="emoji-btn">🎵</button>
  </div>

  <script>
    const app = document.getElementById("app");
    const floatLayer = document.getElementById("float-layer");

    let currentEmoji = "💋";
    let emojiInterval = null;

    function createFloatEmoji() {
      const el = document.createElement("div");
      el.className = "float-emoji";
      el.textContent = currentEmoji;
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = Math.random() * 12 + 18 + "px";
      floatLayer.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }

    function startEmojiRain(emoji) {
      currentEmoji = emoji;
      if (emojiInterval) clearInterval(emojiInterval);
      emojiInterval = setInterval(createFloatEmoji, 500);
    }

    document.querySelectorAll(".emoji-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        startEmojiRain(btn.textContent);
      });
    });

    function firstScreen() {
      app.innerHTML = `
        <div class="card">
          <h2>Hello Momo 🐮💞</h2>
<div class="block">
  <p class="question">How was your day?</p>

  <input
    type="range"
    min="0"
    max="10"
    step="0.1"
    value="7.2"
    id="daySlider"
  />
</div>


          <div class="slider-value" id="sliderValue">7.2</div>
<div class="block">
  <p class="why">Kashala?</p>
  <input type="text" id="whyInput" placeholder="Tell me..." />
</div>

        </div>
      `;

      const slider = document.getElementById("daySlider");
      const valueText = document.getElementById("sliderValue");
      const whyBox = document.getElementById("whyContainer");
      const whyInput = document.getElementById("whyInput");

      slider.addEventListener("input", () => {
        valueText.textContent = slider.value;
        whyBox.style.display = "block";
      });

      whyInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.value.trim() !== "") {
          secondScreen();
        }
      });
    }

    function secondScreen() {
      app.innerHTML = `
        <div class="card">
          <h2>Me has few questions to ask you… 💭</h2>
          <button id="okBtn">Okieee</button>
        </div>
      `;
    }

    firstScreen();
    startEmojiRain("💋");
  </script>

</body>
</html>
