<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Moo 💖</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Delius", cursive;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #fff5ec 0%, #ffe3f2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #app {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #float-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .float-emoji {
      position: absolute;
      font-size: 22px;
      opacity: 0.85;
      animation: floatUp 6s linear forwards;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh); opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }

    .card {
      width: 640px;
      height: 400px;
      padding: 36px;
      background: linear-gradient(180deg, #f6eef4 0%, #e3c8df 100%);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(170,90,160,.28);
      text-align: center;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
    }

    .card.mcq {
      justify-content: flex-start;
    }

    h2 {
      margin: 0;
      color: #4a2c3a;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: #5a4a4a;
      font-size: 18px;
    }

    input[type="range"] {
      width: 100%;
    }

    .slider-value {
      font-size: 18px;
      color: #ff4d6d;
      margin-top: -20px;
    }

    input[type="text"] {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    #emoji-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,.65);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 24px;
      z-index: 3;
    }

    .emoji-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
    }

    .mcq-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    .mcq-btn {
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: rgba(255,255,255,0.95);
      cursor: pointer;
      font-size: 16px;
    }

    .pill-cta {
      background: #b455a0;
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 999px;
      font-size: 18px;
      cursor: pointer;
      min-width: 140px;
      margin: 0 auto;
      display: inline-block;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .valentine-text {
      font-size: 30px;
      color: #4a2c3a;
      min-height: 40px;
    }

    .cta-row {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-top: 30px;
    }

    #noBtn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    #maybeBtn {
      position: relative;
      z-index: 3;
    }

    .valentine-gif {
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 18px;
      margin: 20px auto 0;
      display: block;
    }
  </style>
</head>

<body>

<div id="float-layer"></div>
<div id="app"></div>

<div id="emoji-bar">
  <button class="emoji-btn">💋</button>
  <button class="emoji-btn">🫧</button>
  <button class="emoji-btn">🎈</button>
</div>

<script>
const app = document.getElementById("app");
const floatLayer = document.getElementById("float-layer");

let currentEmoji = "💋";
let emojiInterval;

function createFloatEmoji() {
  const el = document.createElement("div");
  el.className = "float-emoji";
  el.textContent = currentEmoji;
  el.style.left = Math.random() * 100 + "vw";
  floatLayer.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

function startEmojiRain(emoji) {
  currentEmoji = emoji;
  clearInterval(emojiInterval);
  emojiInterval = setInterval(createFloatEmoji, 500);
}

document.querySelectorAll(".emoji-btn").forEach(btn => {
  btn.onclick = () => startEmojiRain(btn.textContent);
});

/* ---------- FLOW ---------- */

function firstScreen() {
  app.innerHTML = `
    <div class="card">
      <h2>Hello Momo 🐮💞</h2>
      <p>How was your day?</p>
      <input type="range" min="0" max="10" step="0.1" value="7.2" id="daySlider">
      <div class="slider-value" id="sliderValue">7.2</div>
      <input type="text" id="whyInput" placeholder="Kashala?" style="display:none">
    </div>
  `;

  const slider = document.getElementById("daySlider");
  const valueText = document.getElementById("sliderValue");
  const whyInput = document.getElementById("whyInput");

  slider.oninput = () => {
    valueText.textContent = slider.value;
    whyInput.style.display = "block";
  };

  whyInput.onkeydown = e => {
    if (e.key === "Enter") secondScreen();
  };
}

const mcqQuestions = [
  { question: "Agar hamari story had a genre.. what would it be?", options: ["Rom-Com","Drama","Indian TV wala","Mystery","Sochna Padega"]},
  { question: "Do you know what I like the most about you? 💕", options: ["You being you 🥹","Pookie 🎀 and Hotness 🔥 - All in one package","Sab kuch.. abhi ho itne ache kya kare 🫶🏻","All of the above🖤"]},
  { question: "Do you miss me?", options: ["Ha thodasa","I miss you","Ab toh aadat si hai mujhko aise jeene meins","Baad mein I will tell"]},
  { question: "Toh hum kab milengeeeee? 😭😭", options: ["Karte hai plan..","Ruko zara, Sabr rakho","Hogaya drama chalu","Chalo Universal"]}
  { question: "Ek aur questionn puchuuu?", options: ["Yes, of course","Bol ree","I know what is coming next","Bola"]}
  { question: "Pakka this is last... puchu kyaa??", options: ["One eternity later","Kiti drama","Jaa re","Okiee"]}
  { question: "Are you readyy???", options: ["Jaldi bol, kal subhe Panvel nikalna hai","I am born ready","No, I am Momo","*duck running gif*"]}
];

let qIndex = 0;

function showMCQ() {
  const q = mcqQuestions[qIndex];
  app.innerHTML = `
    <div class="card mcq">
      <h2>${q.question}</h2>
      <div class="mcq-options">
        ${q.options.map(o => `<button class="mcq-btn">${o}</button>`).join("")}
      </div>
    </div>
  `;

  document.querySelectorAll(".mcq-btn").forEach(btn => {
    btn.onclick = () => {
      qIndex++;
      qIndex < mcqQuestions.length ? showMCQ() : finalScreen();
    };
  });
}

function secondScreen() {
  app.innerHTML = `
    <div class="card">
      <h2>Me has v v v imp questions… 💭</h2>
      <button class="pill-cta" onclick="showMCQ()">Okieee</button>
    </div>
  `;
}

function finalScreen() {
  app.innerHTML = `
    <div class="card">
      <div class="valentine-text" id="typing"></div>
      <div class="cta-row" id="actions" style="display:none">
        <button id="yesBtn" class="pill-cta">Yes 💖</button>
        <button id="noBtn" class="pill-cta">No 😤</button>
        <button id="maybeBtn" class="pill-cta">Maybe 🤔</button>
      </div>
    </div>
  `;

  typeText("Will you be my Valentine? 💌", () => {
    document.getElementById("actions").style.display = "flex";
    setupCTAs();
  });
}

function typeText(text, done) {
  const el = document.getElementById("typing");
  let i = 0;
  const t = setInterval(() => {
    el.textContent += text[i++];
    if (i === text.length) {
      clearInterval(t);
      done();
    }
  }, 80);
}

function setupCTAs() {
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const maybeBtn = document.getElementById("maybeBtn");

  yesBtn.onclick = () => {
    app.innerHTML = `
      <div class="card">
        <h2>YAAAYYYY!! 😭💖</h2>
        <img class="valentine-gif" src="https://media.tenor.com/NLJSPN6qGDUAAAAd/cat-cat-kiss.gif">
      </div>
    `;
  };

  noBtn.addEventListener("mouseenter", () => {
    const p = noBtn.parentElement.getBoundingClientRect();
    noBtn.style.left = Math.random() * (p.width - 140) + "px";
    noBtn.style.top = Math.random() * 80 - 40 + "px";
  });

  maybeBtn.onclick = () => {
    app.innerHTML = `
      <div class="card">
        <img class="valentine-gif" src="https://media.tenor.com/FRiJHoJcXzsAAAAd/nikal-laude.gif">
        <button class="pill-cta" style="margin-top:24px" onclick="finalScreen()">Let’s Try This One More Time 🥹</button>
      </div>
    `;
  };
}

firstScreen();
startEmojiRain("💋");
</script>

</body>
</html>
