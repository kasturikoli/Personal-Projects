<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Moo 💖</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Delius", cursive;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #fff5ec 0%, #ffe3f2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #float-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .float-emoji {
      position: absolute;
      font-size: 22px;
      opacity: 0.85;
      animation: floatUp 6s linear forwards;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh); opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }

    .card {
      width: 640px;
      height: 400px;
      padding: 36px;
      background: linear-gradient(180deg, #f6eef4 0%, #e3c8df 100%);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(170,90,160,.28);
      text-align: center;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
    }

    .card.mcq {
      justify-content: flex-start;
    }

    h2 {
      margin: 0;
      color: #4a2c3a;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: #5a4a4a;
      font-size: 18px;
    }

    input[type="range"] {
      width: 100%;
    }

    .slider-value {
      font-size: 18px;
      color: #ff4d6d;
      margin-top: -20px;
    }

    input[type="text"] {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    #emoji-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,.65);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 24px;
      z-index: 3;
    }

    .emoji-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
    }

    .mcq-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    .mcq-btn {
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: rgba(255,255,255,0.95);
      cursor: pointer;
      font-size: 16px;
    }

    .valentine-text {
      font-size: 30px;
      color: #4a2c3a;
      min-height: 40px;
    }

    .valentine-actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .valentine-gif {
      max-width: 100%;
      max-height: 220px;
      border-radius: 16px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div id="float-layer"></div>
<div id="app"></div>

<div id="emoji-bar">
  <button class="emoji-btn">💋</button>
  <button class="emoji-btn">🫧</button>
  <button class="emoji-btn">🎈</button>
</div>

<script>
  const app = document.getElementById("app");
  const floatLayer = document.getElementById("float-layer");

  let currentEmoji = "💋";
  let emojiInterval;

  function createFloatEmoji() {
    const el = document.createElement("div");
    el.className = "float-emoji";
    el.textContent = currentEmoji;
    el.style.left = Math.random() * 100 + "vw";
    floatLayer.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }

  function startEmojiRain(emoji) {
    currentEmoji = emoji;
    clearInterval(emojiInterval);
    emojiInterval = setInterval(createFloatEmoji, 500);
  }

  document.querySelectorAll(".emoji-btn").forEach(btn => {
    btn.onclick = () => startEmojiRain(btn.textContent);
  });

  function firstScreen() {
    app.innerHTML = `
      <div class="card">
        <h2>Hello Momo 🐮💞</h2>
        <p>How was your day?</p>
        <input type="range" min="0" max="10" step="0.1" value="7.2" id="daySlider">
        <div class="slider-value" id="sliderValue">7.2</div>
        <input type="text" id="whyInput" placeholder="Kashala?" style="display:none">
      </div>
    `;

    const slider = document.getElementById("daySlider");
    const valueText = document.getElementById("sliderValue");
    const whyInput = document.getElementById("whyInput");

    slider.oninput = () => {
      valueText.textContent = slider.value;
      whyInput.style.display = "block";
    };

    whyInput.onkeydown = e => {
      if (e.key === "Enter") secondScreen();
    };
  }

  const mcqQuestions = [
    { question: "Chalo bataoo what I like the most about you? 💕", options: ["You being you 🥹🫶🏻","Pookie🎀 & Edibleness🔥","Abhi ho itne ache kya kare🫶🏻","All of the above🖤"]},
    { question: "Abhi you know me misses you... kitna?", options: ["Bahut zyada","Thoda sa","Obviously","Sab galat"]},
    { question: "Toh hum kab milenge? 😭", options: ["Plan karte","Sabr rakho","Ata chya ata","Drama chalu"] }
  ];

  let qIndex = 0;

  function showMCQ() {
    const q = mcqQuestions[qIndex];
    app.innerHTML = `
      <div class="card mcq">
        <h2>${q.question}</h2>
        <div class="mcq-options">
          ${q.options.map(o => `<button class="mcq-btn">${o}</button>`).join("")}
        </div>
      </div>
    `;

    document.querySelectorAll(".mcq-btn").forEach(btn => {
      btn.onclick = () => {
        qIndex++;
        qIndex < mcqQuestions.length ? showMCQ() : finalScreen();
      };
    });
  }

  function secondScreen() {
    app.innerHTML = `
      <div class="card">
        <h2>Me has v v v imp questions… 💭</h2>
        <button id="okBtn">Okieee</button>
      </div>
    `;
    document.getElementById("okBtn").onclick = () => {
      qIndex = 0;
      showMCQ();
    };
  }

  function finalScreen() {
    app.innerHTML = `
      <div class="card">
        <div class="valentine-text" id="typing"></div>
        <div class="valentine-actions" id="actions" style="display:none">
          <button id="yes">Yes 💖</button>
          <button id="no">No 😤</button>
          <button id="maybe">Maybe 🤔</button>
        </div>
      </div>
    `;

    typeText("Will you be my Valentine? 💌", () => {
      document.getElementById("actions").style.display = "flex";
      setupCTAs();
    });
  }

  function typeText(text, done) {
    const el = document.getElementById("typing");
    let i = 0;
    const t = setInterval(() => {
      el.textContent += text[i++];
      if (i === text.length) {
        clearInterval(t);
        done();
      }
    }, 80);
  }

  function setupCTAs() {
    document.getElementById("yes").onclick = () => {
      app.innerHTML = `
        <div class="card">
          <h2>YAAAYYYY!! 😭💖</h2>
          <img class="valentine-gif" src="https://media.tenor.com/NLJSPN6qGDUAAAAd/cat-cat-kiss.gif">
        </div>
      `;
    };

    document.getElementById("maybe").onclick = () => {
      app.innerHTML = `
        <div class="card">
          <img class="valentine-gif" src="https://media.tenor.com/FRiJHoJcXzsAAAAd/nikal-laude.gif">
        </div>
      `;
    };

    const noBtn = document.getElementById("no");
    noBtn.onmouseenter = () => {
      noBtn.style.transform =
        `translate(${Math.random()*200-100}px,${Math.random()*120-60}px)`;
    };
  }

  firstScreen();
  startEmojiRain("💋");
</script>

</body>
</html>
