<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Moo 💖</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Delius", cursive;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #fff5ec 0%, #ffe3f2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #float-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .float-emoji {
      position: absolute;
      font-size: 22px;
      opacity: 0.85;
      animation: floatUp 6s linear forwards;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh); }
      to { transform: translateY(-10vh); opacity: 0; }
    }

    .card {
      width: 640px;
      height: 400px;
      padding: 36px;
      background: linear-gradient(180deg, #f6eef4 0%, #e3c8df 100%);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(170, 90, 160, 0.28);
      text-align: center;
      z-index: 2;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
    }

    .card.mcq { justify-content: flex-start; }

    h2 { margin: 0; color: #4a2c3a; }

    input[type="range"] { width: 100%; }

    .slider-value { color: #ff4d6d; margin-top: -20px; }

    input[type="text"] {
      padding: 12px;
      border-radius: 12px;
      border: none;
    }

    #emoji-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(255,255,255,0.65);
      padding: 10px 18px;
      border-radius: 24px;
      backdrop-filter: blur(8px);
    }

    .emoji-btn {
      width: 36px;
      height: 36px;
      font-size: 22px;
      border: none;
      background: none;
      cursor: pointer;
    }

    button {
      padding: 14px 22px;
      border-radius: 16px;
      background: #b455a0;
      color: white;
      border: none;
      cursor: pointer;
    }

    .mcq-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    .mcq-btn {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.95);
      cursor: pointer;
    }

    /* Valentine fixes */
    .valentine-actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .valentine-gif {
      max-width: 100%;
      max-height: 220px;
      border-radius: 16px;
      margin: 0 auto;
    }
  </style>
</head>

<body>

<div id="float-layer"></div>
<div id="app"></div>

<div id="emoji-bar">
  <button class="emoji-btn">💋</button>
  <button class="emoji-btn">🫧</button>
  <button class="emoji-btn">🎈</button>
  <button class="emoji-btn">🎵</button>
</div>

<script>
  const app = document.getElementById("app");
  const floatLayer = document.getElementById("float-layer");

  let currentEmoji = "💋";
  let emojiInterval;

  function createFloatEmoji() {
    const e = document.createElement("div");
    e.className = "float-emoji";
    e.textContent = currentEmoji;
    e.style.left = Math.random() * 100 + "vw";
    floatLayer.appendChild(e);
    setTimeout(() => e.remove(), 6000);
  }

  function startEmojiRain(emoji) {
    currentEmoji = emoji;
    clearInterval(emojiInterval);
    emojiInterval = setInterval(createFloatEmoji, 500);
  }

  // ⚠️ YouTube links cannot be played directly via Audio()
  const audio = new Audio();
  function playMusic() {
    alert("YouTube audio cannot play directly. Use MP3 link instead 💔");
  }

  document.querySelectorAll(".emoji-btn").forEach(btn => {
    btn.onclick = () => {
      startEmojiRain(btn.textContent);
      if (btn.textContent === "🎵") playMusic();
    };
  });

  function firstScreen() {
    app.innerHTML = `
      <div class="card">
        <h2>Hello Momo 🐮💞</h2>
        <p>How was your day?</p>
        <input type="range" min="0" max="10" step="0.1" value="7.2" id="daySlider">
        <div class="slider-value" id="sliderValue">7.2</div>
        <input type="text" id="whyInput" placeholder="Kashala?" style="display:none">
      </div>
    `;

    const slider = daySlider;
    slider.onchange = () => {
      sliderValue.textContent = slider.value;
      whyInput.style.display = "block";
    };

    whyInput.onkeydown = e => e.key === "Enter" && secondScreen();
  }

  function secondScreen() {
    app.innerHTML = `
      <div class="card">
        <h2>Me has v v v imp questions… 💭</h2>
        <button onclick="showMCQ()">Okieee</button>
      </div>
    `;
  }

  const mcqQuestions = [...]; // unchanged

  let idx = 0;
  function showMCQ() {
    const q = mcqQuestions[idx];
    app.innerHTML = `
      <div class="card mcq">
        <h2>${q.question}</h2>
        <div class="mcq-options">
          ${q.options.map(o => `<button class="mcq-btn">${o}</button>`).join("")}
        </div>
      </div>
    `;
    document.querySelectorAll(".mcq-btn").forEach(b => {
      b.onclick = () => ++idx < mcqQuestions.length ? showMCQ() : finalScreen();
    });
  }

  function finalScreen() {
    app.innerHTML = `
      <div class="card">
        <h2 id="typing"></h2>
        <div class="valentine-actions">
          <button id="yes">Yes 💖</button>
          <button id="no">No 😤</button>
          <button id="maybe">Maybe 🤔</button>
        </div>
      </div>
    `;

    typeText("Will you be my Valentine? 💌");

    yes.onclick = () => app.innerHTML = `
      <div class="card">
        <h2>YAAAYYYY!! 😭💖</h2>
        <img class="valentine-gif" src="https://media1.tenor.com/m/NLJSPN6qGDUAAAAd/cat-cat-kiss.gif">
      </div>
    `;

    maybe.onclick = () => app.innerHTML = `
      <div class="card">
        <img class="valentine-gif" src="https://media1.tenor.com/m/FRiJHoJcXzsAAAAd/nikal-laude.gif">
      </div>
    `;

    no.onmouseenter = () => {
      no.style.transform = `translate(${Math.random()*200-100}px,${Math.random()*100-50}px)`;
    };
  }

  function typeText(text) {
    let i = 0;
    const t = setInterval(() => {
      typing.textContent += text[i++];
      if (i === text.length) clearInterval(t);
    }, 70);
  }

  firstScreen();
  startEmojiRain("💋");
</script>

</body>
</html>
