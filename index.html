<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For You 💖</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background-color: #cce7ff;
      background-image: radial-gradient(#ffffff 1.5px, transparent 1.5px);
      background-size: 40px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      background: #ffc0cb;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 0.6s ease;
    }

    input {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      position: relative;
    }

    button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #ffffff;
      position: absolute;
      right: 0;
    }

    img {
      margin-top: 20px;
      width: 200px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
  const app = document.getElementById("app");

  function firstScreen() {
    app.innerHTML = `
      <div class="card">
        <h2>Hello 💙</h2>
        <p>Type anything to continue</p>
        <input id="input" placeholder="Type here..." />
      </div>
    `;

    document.getElementById("input").addEventListener("keydown", e => {
      if (e.key === "Enter" && e.target.value.trim() !== "") {
        questionIntro();
      }
    });
  }

  function questionIntro() {
    app.innerHTML = `
      <div class="card">
        <h2>name,</h2>
        <p>I have a question...</p>
      </div>
    `;

    setTimeout(valentineQuestion, 2000);
  }

  function valentineQuestion() {
    app.innerHTML = `
      <div class="card">
        <h2>Will you be my Valentine? 💖</h2>
        <div class="buttons">
          <button id="yes">Yes</button>
          <button id="no">No</button>
        </div>
      </div>
    `;

    const noBtn = document.getElementById("no");
    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    document.getElementById("yes").onclick = finalScreen;
  }

  function finalScreen() {
    app.innerHTML = `
      <div class="card">
        <h1>YAAYYYY 🎉💖</h1>
        <img src="https://media.giphy.com/media/3oz8xAFtqoOUUrsh7W/giphy.gif" alt="Celebration" />
      </div>
    `;
  }

  firstScreen();
</script>

</body>
</html>
